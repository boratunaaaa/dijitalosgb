site:
  name: Dijital OSGB
  site: 'https://dijitalosgb.com'
  base: '/'
  trailingSlash: true

metadata:
  title:
    default: Dijital OSGB
    template: '%s — Dijital OSGB'
  description: "İstanbul, Kocaeli ve Tekirdağ'da OSGB hizmeti ve işyerinde mobil sağlık taraması; Türkiye genelinde uzaktan İSG eğitimi."
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Dijital OSGB
    type: website

i18n:
  language: tr
  textDirection: ltr

# Blog bu sitede yok: içerik stratejisi rehber sayfaları üzerinden yürüyor,
# tarih damgalı yazı akışı değil. Kapalı tutmak gereksiz rota ve sitemap
# kirliliğini önlüyor.
apps:
  blog:
    isEnabled: false
    postsPerPage: 6
    post:
      isEnabled: false
      permalink: '/%slug%'
      robots:
        index: false
    list:
      isEnabled: false
      pathname: 'blog'
      robots:
        index: false
    category:
      isEnabled: false
      pathname: 'category'
      robots:
        index: false
    tag:
      isEnabled: false
      pathname: 'tag'
      robots:
        index: false
    isRelatedPostsEnabled: false
    relatedPostsCount: 0

analytics:
  vendors:
    googleAnalytics:
      id: null

ui:
  theme: 'light:only'
